name: Suar
options:
  bundleIdPrefix: com.dimasdaffa
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

packages:
  Pulse:
    url: https://github.com/kean/Pulse
    from: 5.0.0
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: 0.10.0

targets:
  Suar:
    type: application
    platform: iOS
    destinations: [iPhone] # <-- Membatasi target hanya untuk iPhone (tanpa iPad)
    sources:
      - path: Suar/Suar
      - path: Suar/Suar/SupportingFiles/Font/CourierPrime-Regular.ttf
    info:
      path: Suar/Suar/Info.plist
      properties:
        CFBundleDisplayName: Suar
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon # <-- Menghilangkan error CFBundleIconName missing
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # <-- Mengubungkan Asset Catalog AppIcon
        TARGETED_DEVICE_FAMILY: "1" # <-- 1 = iPhone saja
        CODE_SIGN_ENTITLEMENTS: Suar/Suar/Suar.entitlements
    configFiles:
      Debug: Suar/Suar/SupportingFiles/Config/Config.xcconfig
      Release: Suar/Suar/SupportingFiles/Config/Config.xcconfig
    dependencies:
      - package: Pulse
        product: Pulse
      - package: Pulse
        product: PulseUI
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        basedOnDependencyAnalysis: false

  SuarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Suar/SuarTests
    info:
      path: Suar/SuarTests/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    dependencies:
      - target: Suar
      - package: ViewInspector
        product: ViewInspector