name: Suar
options:
  bundleIdPrefix: com.dimasdaffa
  deploymentTarget:
    iOS: "26.0"
  generateEmptyDirectories: true

packages:
  Pulse:
    url: https://github.com/kean/Pulse
    from: 5.0.0
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: 0.10.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.0

targets:
  Suar:
    type: application
    platform: iOS
    destinations: [iPhone] # <-- Membatasi target hanya untuk iPhone (tanpa iPad)
    sources:
      - path: Suar/Suar
      - path: Suar/Suar/SupportingFiles/Font/CourierPrime-Regular.ttf
      - path: Suar/Suar/SupportingFiles/Font/georgia.ttf
    info:
      path: Suar/Suar/Info.plist
      properties:
        CFBundleDisplayName: Suar
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon # <-- Menghilangkan error CFBundleIconName missing
        NSMicrophoneUsageDescription: "Suar menggunakan mikrofon untuk menyimpan catatan suara pada halaman naskah."
        LLM_OLAGON_API_KEY: "$(LLM_OLAGON_API_KEY)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.openxmlformats.wordprocessingml.document
            UTTypeDescription: Word Document
            UTTypeConformsTo:
              - public.data
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - docx
              public.mime-type:
                - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - UTTypeIdentifier: com.microsoft.word.doc
            UTTypeDescription: Word Document (Legacy)
            UTTypeConformsTo:
              - public.data
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - doc
              public.mime-type:
                - application/msword
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # <-- Mengubungkan Asset Catalog AppIcon
        TARGETED_DEVICE_FAMILY: "1" # <-- 1 = iPhone saja
        CODE_SIGN_ENTITLEMENTS: Suar/Suar/Suar.entitlements
    configFiles:
      Debug: Suar/Suar/SupportingFiles/Config/Config.xcconfig
      Release: Suar/Suar/SupportingFiles/Config/Config.xcconfig
    dependencies:
      - package: Pulse
        product: Pulse
      - package: Pulse
        product: PulseUI
      - package: ZIPFoundation
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        basedOnDependencyAnalysis: false

  SuarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Suar/SuarTests
    info:
      path: Suar/SuarTests/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    dependencies:
      - target: Suar
      - package: ViewInspector
        product: ViewInspector
